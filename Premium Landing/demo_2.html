<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lúmina | Arquitectura & Diseño</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* Variables */
        :root {
            --dark: #1C1C1C;
            --black: #000000;
            --white: #FFFFFF;
            --sand: #E6D5C3;
        }

        /* Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--white);
            color: var(--dark);
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; font-weight: normal; }

        /* Header / Portada */
        .hero {
            height: 90vh;
            background-color: var(--sand);
            display: flex;
            align-items: center;
            padding: 0 10%;
            position: relative;
        }
        .hero-text { max-width: 600px; z-index: 2; }
        .hero h1 { font-size: 4rem; margin-bottom: 20px; color: var(--black); }
        .hero p { font-size: 1.1rem; line-height: 1.8; margin-bottom: 30px; font-weight: 300; }
        .hero-img {
            position: absolute;
            right: 10%;
            top: 20%;
            width: 40%;
            height: 60vh;
            object-fit: cover;
            box-shadow: -20px 20px 0 var(--dark);
        }

        /* Galería / Portafolio */
        .portfolio { padding: 100px 10%; background-color: var(--white); }
        .portfolio h2 { font-size: 3rem; margin-bottom: 50px; text-align: center; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .gallery-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            cursor: pointer;
            filter: grayscale(100%);
            transition: all 0.4s ease;
        }
        .gallery-img:hover {
            filter: grayscale(0%);
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Modal Lightbox (Interactivo con JS) */
        .lightbox {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .lightbox img { max-width: 90%; max-height: 90vh; box-shadow: 0 0 30px rgba(230,213,195,0.3); }
        .close-btn {
            position: absolute;
            top: 30px; right: 40px;
            color: var(--white);
            font-size: 3rem;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* Footer */
        footer {
            background-color: var(--dark);
            color: var(--sand);
            text-align: center;
            padding: 60px 20px;
        }

        /* Responsivo */
        @media (max-width: 850px) {
            .hero { flex-direction: column; justify-content: center; text-align: center; height: auto; padding: 100px 5%; }
            .hero-img { position: relative; right: auto; top: auto; width: 100%; margin-top: 40px; box-shadow: 10px 10px 0 var(--dark); }
            .hero h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-text">
            <h1>Lúmina.</h1>
            <p>Diseñamos espacios que inspiran. Arquitectura contemporánea e interiorismo boutique enfocados en la luz, la textura y la funcionalidad humana.</p>
            <a href="#contacto" style="background-color: var(--black); color: var(--sand); padding: 15px 40px; text-decoration: none; letter-spacing: 2px; font-size: 0.9rem; text-transform: uppercase;">Iniciar Proyecto</a>
        </div>
        <!-- Imagen de Portada -->
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Arquitectura Moderna" class="hero-img">
    </header>

    <section class="portfolio">
        <h2>Obras Selectas</h2>
        <div class="gallery-grid">
            <!-- Imágenes clickeables para abrir el Lightbox -->
            <img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Interior 1" class="gallery-img" onclick="abrirLightbox(this.src)">
            <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Interior 2" class="gallery-img" onclick="abrirLightbox(this.src)">
            <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Interior 3" class="gallery-img" onclick="abrirLightbox(this.src)">
        </div>
    </section>

    <footer id="contacto">
        <h2 style="font-size: 2.5rem; margin-bottom: 20px; color: var(--white);">Hablemos de tu espacio.</h2>
        <p>Tijuana, B.C. | estudio@lumina-arq.com | +52 (664) 111 2222</p>
    </footer>

    <!-- Contenedor del Lightbox (Ventana Emergente para Fotos) -->
    <div id="miLightbox" class="lightbox">
        <span class="close-btn" onclick="cerrarLightbox()">&times;</span>
        <img id="imagenGrande" src="">
    </div>

    <!-- JavaScript para el Lightbox -->
    <script>
        function abrirLightbox(rutaImagen) {
            document.getElementById('imagenGrande').src = rutaImagen;
            document.getElementById('miLightbox').style.display = 'flex';
        }

        function cerrarLightbox() {
            document.getElementById('miLightbox').style.display = 'none';
        }

        // Cerrar si hacen clic fuera de la imagen
        document.getElementById('miLightbox').addEventListener('click', function(e) {
            if (e.target === this) { cerrarLightbox(); }
        });
    </script>

</body>
</html>

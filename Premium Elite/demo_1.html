<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Panteón Clásico | Los 12 Olímpicos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        /* Paleta de 8 Colores: Museo Clásico */
        :root {
            --c-marmol: #F5F5F0;     /* Mármol Puro (Fondo) */
            --c-onice: #1A1A1A;      /* Ónice Oscuro (Texto) */
            --c-oro: #D4AF37;        /* Oro Olímpico (Acentos) */
            --c-egeo: #1B263B;       /* Azul Egeo (Paneles Oscuros) */
            --c-bronce: #CD7F32;     /* Bronce Antiguo (Detalles) */
            --c-granate: #7A1C1C;    /* Granate Profundo (Resaltados) */
            --c-piedra: #6C757D;     /* Gris Piedra (Bordes) */
            --c-nieve: #FFFFFF;      /* Blanco Nieve (Tarjetas) */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cormorant Garamond', serif; background-color: var(--c-marmol); color: var(--c-onice); display: flex; overflow-x: hidden; }
        h1, h2, h3, .nav-btn { font-family: 'Cinzel', serif; }

        /* Sidebar - Menú Lateral Simétrico */
        .sidebar {
            width: 340px; height: 100vh; background-color: var(--c-egeo);
            position: fixed; display: flex; flex-direction: column; 
            border-right: 4px solid var(--c-oro); z-index: 1000;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .logo-box { padding: 40px 20px; text-align: center; border-bottom: 1px solid rgba(212, 175, 55, 0.3); }
        .logo-box h2 { color: var(--c-nieve); font-size: 2.2rem; letter-spacing: 4px; margin-bottom: 5px; }
        .logo-box span { color: var(--c-oro); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; }

        .nav-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
            background-color: rgba(212, 175, 55, 0.2); margin-top: auto; margin-bottom: auto;
        }
        .nav-btn {
            background: var(--c-egeo); border: none; color: var(--c-piedra);
            padding: 20px 10px; text-align: center; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 1px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .nav-btn span { font-size: 1.5rem; color: var(--c-bronce); margin-bottom: 5px; opacity: 0.5; transition: 0.4s; font-family: 'Cormorant Garamond', serif; }
        .nav-btn:hover { color: var(--c-marmol); background: rgba(255,255,255,0.05); }
        .nav-btn:hover span { opacity: 1; transform: translateY(-3px); }
        .nav-btn.active { color: var(--c-nieve); background: var(--c-granate); }
        .nav-btn.active span { color: var(--c-oro); opacity: 1; }

        .sidebar-footer { padding: 20px; text-align: center; color: var(--c-piedra); font-size: 0.8rem; border-top: 1px solid rgba(212, 175, 55, 0.3); font-family: 'Arial', sans-serif; }

        /* Contenido Principal */
        .main-content { margin-left: 340px; width: calc(100% - 340px); min-height: 100vh; padding: 60px 5%; }
        
        /* Efectos de Cascada (Staggered Animations) */
        .god-section { display: none; }
        .god-section.active { display: block; }
        
        .anim-element { opacity: 0; transform: translateY(30px); }
        .god-section.active .anim-element { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .god-section.active .delay-1 { animation-delay: 0.1s; }
        .god-section.active .delay-2 { animation-delay: 0.2s; }
        .god-section.active .delay-3 { animation-delay: 0.3s; }
        .god-section.active .delay-4 { animation-delay: 0.4s; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* Estructura Interna */
        .god-header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid var(--c-oro); padding-bottom: 30px; }
        .god-header h1 { font-size: 5rem; color: var(--c-egeo); margin-bottom: 0; letter-spacing: -2px; line-height: 1; }
        .god-header .domain { font-size: 1.6rem; color: var(--c-granate); font-style: italic; font-family: 'Cormorant Garamond', serif; }

        .layout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-bottom: 50px; }
        
        /* Tarjeta de Información */
        .info-card { background: var(--c-nieve); padding: 40px; border-radius: 8px; border: 1px solid #E0E0E0; box-shadow: 0 20px 40px rgba(0,0,0,0.08); position: relative; }
        .info-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px; background: linear-gradient(90deg, var(--c-oro), var(--c-bronce)); border-radius: 8px 8px 0 0; }
        
        .data-list { list-style: none; margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .data-item { background: var(--c-marmol); padding: 15px; border-left: 3px solid var(--c-egeo); }
        .data-item strong { color: var(--c-egeo); font-family: 'Cinzel', serif; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        .data-item span { font-size: 1.1rem; color: var(--c-granate); font-style: italic; }
        
        .lore-text { font-size: 1.25rem; line-height: 1.8; text-align: justify; color: var(--c-onice); }
        .lore-text p { margin-bottom: 20px; }
        .lore-text h3 { color: var(--c-egeo); font-size: 1.5rem; margin: 30px 0 15px; border-bottom: 1px solid var(--c-bronce); display: inline-block; padding-bottom: 5px; }

        /* Imágenes con Efectos Parallax Simulado */
        .img-container { position: relative; overflow: hidden; border-radius: 8px; box-shadow: -20px 20px 0 var(--c-egeo); transition: 0.5s; cursor: pointer; }
        .img-container:hover { box-shadow: -25px 25px 0 var(--c-oro); transform: translate(5px, -5px); }
        /* object-position: center top evita que se corten las cabezas */
        .img-main { width: 100%; height: 100%; object-fit: cover; object-position: center top; min-height: 650px; transition: transform 1s ease; }
        .img-container:hover .img-main { transform: scale(1.08); }

        .sub-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .sub-img-box { overflow: hidden; border-radius: 8px; border: 2px solid var(--c-bronce); position: relative; cursor: pointer; }
        .sub-img-box::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(27, 38, 59, 0.3); transition: 0.4s; pointer-events: none; }
        .sub-img-box:hover::after { background: rgba(27, 38, 59, 0); }
        .sub-img { width: 100%; height: 350px; object-fit: cover; object-position: center top; transition: 0.7s; }
        .sub-img-box:hover .sub-img { transform: scale(1.1); }

        /* Estilos del Lightbox (Visor de Imágenes) */
        .lightbox {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(26, 26, 26, 0.95); z-index: 9999;
            justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .lightbox.active { display: flex; opacity: 1; }
        /* object-fit: contain asegura que la imagen NO se corte a medias en el visor */
        .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border: 2px solid var(--c-oro); box-shadow: 0 0 40px rgba(0,0,0,0.8); border-radius: 4px; }
        .lightbox-close { position: absolute; top: 20px; right: 40px; color: var(--c-nieve); font-size: 3rem; cursor: pointer; font-family: sans-serif; transition: 0.3s; line-height: 1; }
        .lightbox-close:hover { color: var(--c-oro); transform: scale(1.1); }

        @media (max-width: 1200px) {
            .layout-grid { grid-template-columns: 1fr; }
            .img-container { height: 500px; }
            .img-main { min-height: 500px; }
        }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
            .nav-grid { grid-template-columns: repeat(4, 1fr); }
            .nav-btn span { display: none; }
            .main-content { margin-left: 0; width: 100%; padding: 40px 5%; }
            .god-header h1 { font-size: 3.5rem; }
            .data-list { grid-template-columns: 1fr; }
            .sub-gallery { grid-template-columns: 1fr; gap: 20px; }
            .sidebar-footer { display: none; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-box">
            <h2>OLIMPO</h2>
            <span>Archivo Mitológico</span>
        </div>
        <nav class="nav-grid" id="menu">
            </nav>
        <div class="sidebar-footer">
            Diseñado en Tijuana, B.C. | 2026
        </div>
    </aside>

    <main class="main-content" id="content-area">
        </main>

    <div id="lightbox" class="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="Vista Ampliada">
    </div>

    <script>
        const olimpoData = [
            { id: 'zeus', name: "Zeus", num: "I", roman: "Júpiter", domain: "Rey del Olimpo y los Cielos", symbols: "Rayo, Águila, Roble", cult: "Olimpia, Dodona",
              historia: "Gobernante supremo del panteón tras liderar a sus hermanos en la Titanomaquia y desterrar a su padre Cronos al Tártaro. Zeus impone el orden, la ley y la justicia en el cosmos, presidiendo desde su trono en el Monte Olimpo.",
              mito: "A pesar de ser el guardián del orden, es tristemente célebre por sus constantes metamorfosis (en cisne, toro, lluvia de oro) para seducir a diosas, ninfas y mortales, desatando la furia de su esposa Hera y engendrando héroes legendarios como Perseo y Heracles.",
              relaciones: "Hijo de Cronos y Rea. Esposo de Hera. Padre de Atenea, Apolo, Artemisa, Ares, Hermes, Dioniso y numerosos semidioses.",
              imgs: ['zeus_1.jpg', 'zeus_2.jpg', 'zeus_3.jpg'] },
            { id: 'hera', name: "Hera", num: "II", roman: "Juno", domain: "Reina de los Dioses", symbols: "Pavo Real, Granada, Diadema", cult: "Argos, Samos, Olimpia",
              historia: "La deidad femenina más poderosa. Protectora sagrada de las mujeres, el matrimonio legítimo y el parto. Su presencia es de una majestad inquebrantable, exigiendo respeto absoluto tanto de dioses como de mortales.",
              mito: "Su mitología está marcada por una cólera implacable. Condenó a Eco a repetir las últimas palabras de otros, envió serpientes a asesinar al bebé Heracles y maldijo a Leto para que no pudiera dar a luz en tierra firme, todo como venganza por las infidelidades de Zeus.",
              relaciones: "Hija de Cronos y Rea. Esposa de Zeus. Madre de Ares, Hefesto y Hebe.",
              imgs: ['hera_1.jpg', 'hera_2.jpg', 'hera_3.jpg'] },
            { id: 'poseidon', name: "Poseidón", num: "III", roman: "Neptuno", domain: "Señor de los Mares", symbols: "Tridente, Caballo, Delfín", cult: "Corinto, Sounion",
              historia: "El gobernante absoluto de las aguas. Tras la derrota de los Titanes, el mundo se dividió en tres, y a él le correspondió el océano. Habitaba en un palacio de coral y gemas en las profundidades del mar Egeo.",
              mito: "Conocido como 'El Agitador de la Tierra'. Su furia provocaba tormentas y terremotos. Compitió contra Atenea por el patronazgo de Atenas, ofreciendo un manantial de agua salada (o el primer caballo), pero perdió ante el olivo de la diosa, lo que provocó que maldijera temporalmente la ciudad sin agua.",
              relaciones: "Hermano de Zeus y Hades. Esposo de Anfítrite. Padre del cíclope Polifemo, Teseo y el caballo alado Pegaso.",
              imgs: ['poseidon_1.jpg', 'poseidon_2.jpg', 'poseidon_3.jpg'] },
            { id: 'demeter', name: "Deméter", num: "IV", roman: "Ceres", domain: "Diosa de la Agricultura", symbols: "Espiga de Trigo, Antorcha", cult: "Eleusis",
              historia: "La madre nutricia. De ella dependía la supervivencia de la humanidad, pues otorgaba las cosechas, el grano y la fertilidad de la tierra. Su culto en los Misterios Eleusinos era el más sagrado y secreto de toda la Antigua Grecia.",
              mito: "Cuando Hades secuestró a su hija Perséfone, el dolor de Deméter marchitó el mundo, creando el primer invierno. Amenazó con matar de hambre a la humanidad hasta que Zeus intervino. El pacto final estableció que Perséfone pasaría una parte del año en el inframundo (otoño/invierno) y el resto con su madre (primavera/verano).",
              relaciones: "Hermana de Zeus. Madre de Perséfone (con Zeus) y de Pluto.",
              imgs: ['demeter_1.jpg', 'demeter_2.jpg', 'demeter_3.jpg'] },
            { id: 'atenea', name: "Atenea", num: "V", roman: "Minerva", domain: "Diosa de la Sabiduría y la Estrategia", symbols: "Búho, Olivo, Égida", cult: "Atenas (El Partenón)",
              historia: "Nació de la cabeza de Zeus, completamente armada y lanzando un grito de guerra. Representa la inteligencia, las matemáticas, la artesanía y la guerra táctica, en contraste con la brutalidad sin sentido de Ares.",
              mito: "Es la protectora por excelencia de los grandes héroes. Guio a Odiseo en su viaje de regreso a Ítaca, ayudó a Perseo a decapitar a Medusa entregándole un escudo pulido como espejo, y asistió a Heracles en sus doce trabajos.",
              relaciones: "Hija predilecta de Zeus (nacida de Metis). Juró castidad eterna, siendo una de las tres diosas vírgenes.",
              imgs: ['atenea_1.jpg', 'atenea_2.jpg', 'atenea_3.jpg'] },
            { id: 'apolo', name: "Apolo", num: "VI", roman: "Apolo", domain: "Dios de la Luz, las Artes y la Profecía", symbols: "Lira, Arco Dorado, Laurel", cult: "Delfos, Delos",
              historia: "El ideal de la juventud y belleza masculina (Kouros). Apolo conduce el sol por el cielo y es el maestro indiscutible de las Musas. A través de la Pitia en su santuario de Delfos, dictaba profecías que decidían el destino de reyes y naciones.",
              mito: "Es un dios de dualidades extremas. Patrón de la medicina y la curación, pero capaz de disparar flechas infectadas con plagas. Transformó a su amada Dafne en un árbol de laurel para salvarla de su propia persecución, motivo por el cual siempre lleva una corona de hojas de laurel.",
              relaciones: "Hijo de Zeus y Leto. Hermano gemelo de Artemisa. Padre de Asclepio (dios de la medicina) y Orfeo.",
              imgs: ['apolo_1.jpg', 'apolo_2.jpg', 'apolo_3.jpg'] },
            { id: 'artemisa', name: "Artemisa", num: "VII", roman: "Diana", domain: "Diosa de la Caza y la Naturaleza Salvaje", symbols: "Arco de Plata, Ciervo, Luna", cult: "Éfeso, Esparta",
              historia: "Hermana gemela de Apolo. Es la guardiana implacable de los bosques, las montañas y los animales salvajes. Artemisa exigió a su padre Zeus seis deseos, siendo el primero mantener su virginidad eterna y nunca atarse al matrimonio.",
              mito: "De naturaleza protectora pero vengativa. Cuando el cazador Acteón la vio bañándose desnuda accidentalmente en el bosque, ella lo transformó en un ciervo, provocando que fuera devorado por sus propios perros de caza. Es protectora de las niñas y las doncellas.",
              relaciones: "Hija de Zeus y Leto. Hermana gemela de Apolo. Acompañada siempre por su séquito de ninfas.",
              imgs: ['artemisa_1.jpg', 'artemisa_2.jpg', 'artemisa_3.jpg'] },
            { id: 'ares', name: "Ares", num: "VIII", roman: "Marte", domain: "Dios de la Guerra Sangrienta", symbols: "Lanza, Casco, Buitre", cult: "Esparta, Tracia",
              historia: "La encarnación del caos, la sed de sangre y el frenesí de la batalla. Mientras los atenienses adoraban la estrategia de Atenea, los guerreros de Esparta consideraban a Ares su máximo patrón, pidiéndole fuerza destructiva antes del combate.",
              mito: "A pesar de ser el dios de la guerra, fue derrotado varias veces en la mitología (incluyendo por mortales como Diomedes, con ayuda de Atenea). Su mito más famoso no es bélico, sino romántico: su intenso, apasionado y adúltero romance con Afrodita, la diosa del amor.",
              relaciones: "Hijo legítimo de Zeus y Hera (ambos lo despreciaban por su brutalidad). Padre de Fobos (Miedo), Deimos (Terror) y Eros (con Afrodita).",
              imgs: ['ares_1.jpg', 'ares_2.jpg', 'ares_3.jpg'] },
            { id: 'afrodita', name: "Afrodita", num: "IX", roman: "Venus", domain: "Diosa del Amor, el Deseo y la Belleza", symbols: "Concha, Paloma, Manzana de Oro", cult: "Pafos, Chipre, Corinto",
              historia: "Nacida de la espuma del mar cerca de Chipre, tras la castración del titán Urano. Afrodita rige sobre la pasión, la procreación y la atracción irresistible, teniendo el poder de nublar el juicio de cualquier ser vivo, mortal o divino.",
              mito: "Fue la chispa que encendió la Guerra de Troya al ofrecerle a Paris el amor de la mujer más hermosa del mundo, Helena. Aunque Zeus la obligó a casarse con el deforme Hefesto para evitar guerras entre los dioses, ella mantuvo numerosos amantes, siendo Ares su gran pasión.",
              relaciones: "Nacida de Urano (o hija de Zeus y Dione). Esposa de Hefesto. Madre de Eros, Eneas y Deimos.",
              imgs: ['afrodita_1.jpg', 'afrodita_2.jpg', 'afrodita_3.jpg'] },
            { id: 'hefesto', name: "Hefesto", num: "X", roman: "Vulcano", domain: "Dios del Fuego y la Forja", symbols: "Yunque, Martillo, Volcán", cult: "Atenas, Lemnos",

              mito: "Para vengarse de Hera por haberlo rechazado, forjó un trono de oro mágico que la atrapó, negándose a liberarla hasta que le fue concedida la mano de Afrodita. Sus forjas se encuentran bajo los volcanes, donde trabaja junto a los Cíclopes elaborando autómatas e invenciones imposibles.",
              relaciones: "Hijo de Hera (a menudo engendrado sola por partenogénesis). Esposo de Afrodita.",
              imgs: ['hefesto_1.jpg', 'hefesto_2.jpg', 'hefesto_3.jpg'] },
            { id: 'hermes', name: "Hermes", num: "XI", roman: "Mercurio", domain: "Mensajero y Dios de las Fronteras", symbols: "Caduceo, Sandalias Aladas", cult: "Arcadia, Monte Cilene",

              mito: "Viajó por todo el mundo conocido (hasta la India) enseñando a los humanos el cultivo de la vid. Sus seguidoras femeninas, las Ménades, entraban en trances de éxtasis salvaje y eran capaces de despedazar bestias con sus propias manos si alguien intentaba detener sus ritos sagrados.",
              relaciones: "Hijo de Zeus y la princesa mortal Sémele. Rescatado del vientre en llamas de su madre y gestado en el muslo de Zeus.",
              imgs: ['dioniso_1.jpg', 'dioniso_2.jpg', 'dioniso_3.jpg'] }
        ];

        const baseUrl = "https://raw.githubusercontent.com/luisarmandoramirezcardenas6023-ux/Trabajo/main/Premium%20Elite/";
        const menuContainer = document.getElementById('menu');
        const contentArea = document.getElementById('content-area');

        // Lógica del Lightbox
        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            lb.classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
        // Cerrar lightbox si tocan fuera de la imagen
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if(e.target === this) closeLightbox();
        });
        document.addEventListener('keydown', function(e) {
            if(e.key === 'Escape') closeLightbox();
        });

        function buildApp() {
            olimpoData.forEach((god, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `<span>${god.num}</span> ${god.name}`;
                btn.onclick = (e) => switchView(god.id, e.currentTarget);
                menuContainer.appendChild(btn);

                const view = document.createElement('section');
                view.id = `view-${god.id}`;
                view.className = `god-section ${index === 0 ? 'active' : ''}`;
                view.innerHTML = `
                    <div class="god-header anim-element delay-1">
                        <h1>${god.name}</h1>
                        <span class="domain">${god.domain}</span>
                    </div>

                    <div class="layout-grid">
                        <div class="img-container anim-element delay-2" onclick="openLightbox('${baseUrl}${god.imgs[0]}')">
                            <img src="${baseUrl}${god.imgs[0]}" alt="${god.name}" class="img-main">
                        </div>
                        
                        <div class="info-card anim-element delay-3">
                            <ul class="data-list">
                                <li class="data-item"><strong>Nombre Romano</strong><span>${god.roman}</span></li>
                                <li class="data-item"><strong>Atributos Sagrados</strong><span>${god.symbols}</span></li>
                                <li class="data-item"><strong>Centros de Culto</strong><span>${god.cult}</span></li>
                                <li class="data-item"><strong>Relaciones</strong><span>${god.relaciones}</span></li>
                            </ul>
                            <div class="lore-text">
                                <h3>Dominio Divino</h3>
                                <p>${god.historia}</p>
                                <h3>Mitos Destacados</h3>
                                <p>${god.mito}</p>
                            </div>
                        </div>
                    </div>

                    <div class="sub-gallery anim-element delay-4">
                        <div class="sub-img-box" onclick="openLightbox('${baseUrl}${god.imgs[1]}')">
                            <img src="${baseUrl}${god.imgs[1]}" alt="Mito ${god.name} 1" class="sub-img">
                        </div>
                        <div class="sub-img-box" onclick="openLightbox('${baseUrl}${god.imgs[2]}')">
                            <img src="${baseUrl}${god.imgs[2]}" alt="Mito ${god.name} 2" class="sub-img">
                        </div>
                    </div>
                `;
                contentArea.appendChild(view);
            });
        }

        function switchView(id, btn) {
            document.querySelectorAll('.god-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            const targetView = document.getElementById(`view-${id}`);
            targetView.classList.remove('active');
            void targetView.offsetWidth; 
            
            targetView.classList.add('active');
            btn.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        buildApp();
    </script>
</body>
</html>
